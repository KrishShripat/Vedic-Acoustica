apiVersion: apps/v1
kind: Deployment
metadata:
  name: vedic-frontend
  labels:
    app: vedic-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vedic-frontend
  template:
    metadata:
      labels:
        app: vedic-frontend
    spec:
      containers:
        - name: frontend
          image: vedic-acoustica/frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_HOST
              value: vedic-backend-service
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vedic-frontend-service
spec:
  selector:
    app: vedic-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP   # Ingress handles external traffic; no public LB needed
