apiVersion: apps/v1
kind: Deployment
metadata:
  name: vedic-frontend
  labels:
    app: vedic-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vedic-frontend
  template:
    metadata:
      labels:
        app: vedic-frontend
    spec:
      containers:
        - name: frontend
          image: vedic-acoustica/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: vedic-frontend-service
spec:
  selector:
    app: vedic-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
