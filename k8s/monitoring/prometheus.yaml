apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # In-cluster backend. Runs with DJANGO_DEBUG=False so /metrics is
      # bearer-token guarded (F14); the token is mounted below from the
      # vedic-secrets Secret.
      - job_name: 'vedic-backend'
        static_configs:
          - targets: ['vedic-backend-service:8000']
        metrics_path: '/metrics/'
        scrape_interval: 10s
        bearer_token_file: /etc/prometheus/secrets/metrics-token

      # Production Hugging Face Space — same token, guard enforced.
      - job_name: 'vedic-backend-prod'
        scheme: https
        static_configs:
          - targets: ['krish-shripat-vedic-backend.hf.space']
        metrics_path: '/metrics/'
        scrape_interval: 30s
        bearer_token_file: /etc/prometheus/secrets/metrics-token

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
        scrape_interval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
            - name: metrics-token
              mountPath: /etc/prometheus/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: data
          emptyDir: {}
        - name: metrics-token
          secret:
            secretName: vedic-secrets
            items:
              - key: metrics-token
                path: metrics-token
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090