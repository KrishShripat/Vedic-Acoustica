apiVersion: apps/v1
kind: Deployment
metadata:
  name: vedic-backend
  labels:
    app: vedic-backend
spec:
  replicas: 1  # SQLite supports one writer; keep at 1 until migrated to PostgreSQL
  selector:
    matchLabels:
      app: vedic-backend
  template:
    metadata:
      labels:
        app: vedic-backend
    spec:
      initContainers:
        - name: backend-migrate
          image: vedic-acoustica/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vedic-secrets
                  key: django-secret-key
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_DB_PATH
              value: /app/data/db.sqlite3
            - name: DJANGO_MEDIA_ROOT
              value: /app/data/media
            - name: DJANGO_ALLOWED_HOSTS
              value: "vedic.local,localhost,127.0.0.1"   # replace vedic.local with your real domain
            - name: CELERY_BROKER_URL
              value: redis://vedic-redis-service:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://vedic-redis-service:6379/0
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      containers:
        - name: backend
          image: vedic-acoustica/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vedic-secrets
                  key: django-secret-key
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_DB_PATH
              value: /app/data/db.sqlite3
            - name: DJANGO_MEDIA_ROOT
              value: /app/data/media
            - name: DJANGO_ALLOWED_HOSTS
              value: "vedic.local,localhost,127.0.0.1"   # replace vedic.local with your real domain
            - name: CELERY_BROKER_URL
              value: redis://vedic-redis-service:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://vedic-redis-service:6379/0
            # Must match the value in the vedic-secrets metrics-token key for
            # /metrics scrapes to authenticate in-cluster (F14).
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vedic-secrets
                  key: metrics-token
          volumeMounts:
            - name: app-data
              mountPath: /app/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/recordings/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/recordings/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: vedic-data-pvc