# ---------------------------------------------------------------------------
# Secrets — placeholders only.
# NEVER commit real values. In production, manage this with:
#   kubectl create secret generic vedic-secrets \
#     --from-literal=django-secret-key="$(openssl rand -base64 50)" \
#     --from-literal=metrics-token="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
# Or use Sealed Secrets / External Secrets Operator.
#
#   django-secret-key  Django SECRET_KEY (required by the app)
#   metrics-token      Bearer token that must also be set via METRICS_TOKEN on
#                      prod (HF Space). /metrics returns 403 without it (F14).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: vedic-secrets
type: Opaque
stringData:
  django-secret-key: "REPLACE_WITH_REAL_SECRET_KEY_DO_NOT_COMMIT"
  metrics-token: "REPLACE_WITH_REAL_METRICS_TOKEN_DO_NOT_COMMIT"