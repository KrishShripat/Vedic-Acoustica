apiVersion: apps/v1
kind: Deployment
metadata:
  name: vedic-celery
  labels:
    app: vedic-celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vedic-celery
  template:
    metadata:
      labels:
        app: vedic-celery
    spec:
      containers:
        - name: celery
          image: vedic-acoustica/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - vedic_acoustica
            - worker
            - --loglevel=info
            - --concurrency=2
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vedic-secrets
                  key: django-secret-key
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_DB_PATH
              value: /app/data/db.sqlite3
            - name: DJANGO_MEDIA_ROOT
              value: /app/data/media
            - name: DJANGO_ALLOWED_HOSTS
              value: "vedic.local,localhost,127.0.0.1"   # replace vedic.local with your real domain
            - name: CELERY_BROKER_URL
              value: redis://vedic-redis-service:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://vedic-redis-service:6379/0
          volumeMounts:
            # Must mount the SAME shared PVC as the Django pods so that:
            #  - Django (upload) writes .wav to /app/data/media
            #  - Celery (ML task) reads .wav and writes .npz back
            # This requires ReadWriteMany (e.g. NFS / AWS EFS provisioner).
            - name: app-data
              mountPath: /app/data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - vedic_acoustica
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: vedic-data-pvc   # shared with Django pods