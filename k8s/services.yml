apiVersion: v1
kind: Secret
metadata:
  name: vedic-secrets
type: Opaque
stringData:
  django-secret-key: "change-this-to-a-real-secret-key"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vedic-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vedic-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vedic-backend-service
                port:
                  number: 8000
