# ---------------------------------------------------------------------------
# Reusable logging cap — prevents container log files from growing unbounded.
# Applied to stateful / high-output services via the YAML merge key below.
# ---------------------------------------------------------------------------
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    <<: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - DJANGO_DEBUG=True
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_DB_PATH=/app/data/db.sqlite3
    volumes:
      - media_data:/app/media
      - db_data:/app/data  # SQLite DB lives here; survives container restarts
    mem_limit: 2g
    restart: unless-stopped
    <<: *default-logging
    depends_on:
      redis:
        condition: service_healthy

  celery:
    build: ./backend
    # concurrency=2: each librosa analysis peaks ~1.5 GB RAM → 2 workers ≈ 3 GB peak.
    # mem_limit must stay above 2 × peak. Raise concurrency only if mem_limit is also raised.
    command: celery -A vedic_acoustica worker --loglevel=info --concurrency=2
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - DJANGO_DEBUG=True
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_DB_PATH=/app/data/db.sqlite3
    volumes:
      # Share the same media volume so .npz files written by the worker
      # are visible to the Django backend when serving GET responses.
      - media_data:/app/media
      - db_data:/app/data  # Same SQLite volume as backend; both services share the DB
    mem_limit: 6g   # 2 workers × ~1.5 GB peak each + 1 GB headroom
    restart: unless-stopped
    <<: *default-logging
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_HOST=backend
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    environment:
      - BACKEND_METRICS_HOST=backend
      # Matches the METRICS_TOKEN set on the backend / HF Space. Prometheus
      # injects its own env vars into ${METRICS_TOKEN} in prometheus.yml.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana-provisioning.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/vedic-acoustica.json
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  media_data:
  grafana_data:
  redis_data:
  db_data:  # Persists SQLite DB across backend/celery restarts
