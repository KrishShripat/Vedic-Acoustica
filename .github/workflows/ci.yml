name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django + ML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps (libsndfile for librosa)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

      - name: Verify ML engine imports (librosa + sklearn)
        run: python -c "from ml_engine import audio_processing, ml_engine, ghana_patha; print('ML engine OK')"

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
