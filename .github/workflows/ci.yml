name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django + ML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps (libsndfile for librosa)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check
        env:
          DJANGO_DEBUG: "True"

      - name: Run Django tests
        run: python manage.py test --verbosity=2
        env:
          DJANGO_DEBUG: "True"

      - name: Verify ML engine imports (librosa + sklearn)
        run: python -c "from ml_engine import audio_processing, ml_engine, ghana_patha, raga_mapping; print('ML engine OK')"
        env:
          DJANGO_DEBUG: "True"

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build-check:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    # Verify both Dockerfiles build without error on every PR/push.
    # Images are NOT pushed here — that is the CD pipeline's job.
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build ./backend \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t vedic-backend:ci-check \
            --no-cache

      - name: Build frontend image
        run: |
          docker build ./frontend \
            -t vedic-frontend:ci-check \
            --no-cache
