name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate: CI must be green before we build/push images ──────────────────────
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA for image tag
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Layer cache pulled from registry — speeds up repeat builds significantly
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:cache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:cache,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ steps.meta.outputs.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:cache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:cache,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ steps.meta.outputs.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    # Deploy only when the KUBECONFIG secret is configured.
    # Without it, kubectl auth fails and the job would fail noisily on
    # every push.  Set the secret in repo Settings → Secrets to enable.
    if: ${{ secrets.KUBECONFIG != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      - name: Pin image tags in k8s manifests
        run: |
          SHA=${{ needs.build-and-push.outputs.sha }}
          REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          sed -i "s|vedic-acoustica/backend:latest|${REGISTRY}/backend:${SHA}|g"   k8s/backend/deployment.yaml
          sed -i "s|vedic-acoustica/backend:latest|${REGISTRY}/backend:${SHA}|g"   k8s/celery/deployment.yaml
          sed -i "s|vedic-acoustica/frontend:latest|${REGISTRY}/frontend:${SHA}|g" k8s/frontend/deployment.yaml

      - name: Apply manifests
        run: kubectl apply -k k8s/

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/vedic-backend  --timeout=300s
          kubectl rollout status deployment/vedic-celery   --timeout=300s
          kubectl rollout status deployment/vedic-frontend --timeout=300s

      - name: Smoke-test deployed API
        run: |
          # Give the Ingress a moment to route traffic
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DEPLOY_HOST }}/api/recordings/)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: /api/recordings/ returned HTTP $STATUS"
            exit 1
          fi
          echo "Smoke test passed (HTTP 200)"
